<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Upload db.json to Firebase</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; }
        pre { background-color: #f4f4f4; padding: 10px; border: 1px solid #ccc; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>เครื่องมืออัปโหลด db.json</h1>
    <p>ระบบจะอ่านไฟล์ <code>db.json</code> แปลงหัวข้อภาษาไทยเป็นอังกฤษ และสุ่มโต๊ะให้</p>

    <button id="uploadButton" disabled>กำลังโหลด...</button>
    <div id="status">สถานะ: รอการทำงาน...</div>
    <hr>
    <h2>ตัวอย่างข้อมูลที่จะอัปโหลด (5 คนแรก):</h2>
    <pre id="preview"></pre>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="data.js"></script>

    <script>
        const uploadButton = document.getElementById('uploadButton');
        const statusDiv = document.getElementById('status');
        const previewPre = document.getElementById('preview');
        let jsonDataArray = null;

        function setStatus(msg, isError = false) {
            statusDiv.textContent = `สถานะ: ${msg}`;
            statusDiv.style.color = isError ? 'red' : 'green';
        }

        async function init() {
            try {
                // เรียกใช้ฟังก์ชันแปลงข้อมูลจาก data.js
                jsonDataArray = await Database.initializeUpload();
                
                previewPre.textContent = JSON.stringify(jsonDataArray.slice(0, 5), null, 2);
                setStatus(`พร้อมอัปโหลด! จำนวนทั้งหมด ${jsonDataArray.length} คน`);
                uploadButton.textContent = "เริ่มอัปโหลดข้อมูล";
                uploadButton.disabled = false;
            } catch (err) {
                setStatus(`Error: ${err.message}`, true);
            }
        }

        uploadButton.addEventListener('click', async () => {
            if (!confirm(`ยืนยันการเขียนทับข้อมูลทั้งหมดไปยัง Firebase?\n(Path: ${Database.config.DB_PATH})`)) return;
            
            uploadButton.disabled = true;
            setStatus("กำลังอัปโหลด...");
            try {
                await Database.uploadAllData(jsonDataArray);
                setStatus("อัปโหลดสำเร็จเรียบร้อย!", false);
                alert("Upload Complete!");
            } catch (err) {
                setStatus(`Upload Failed: ${err.message}`, true);
                uploadButton.disabled = false;
            }
        });

        init();
    </script>
</body>
</html>
